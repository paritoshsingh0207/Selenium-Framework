name: Google Photos Migrator Cloud Run

# Manual-only production deployment. One-time Google Cloud infrastructure is
# prepared by deployment/bootstrap-gcp.sh before this workflow is run.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-photos-migrator-cloudrun
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: mvn --batch-mode verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: google-photos-migrator-production
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Java service to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          source: .
          timeout: 60m
          flags: '--concurrency=1 --max-instances=1 --service-account=${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}'
          env_vars_update_strategy: overwrite
          env_vars: |-
            LEDGER_STORAGE_MODE=gcs
            LEDGER_BUCKET_NAME=${{ vars.LEDGER_BUCKET_NAME }}
            LEDGER_OBJECT_PREFIX=migrations
            OAUTH_VAULT_MODE=gcs
            OAUTH_VAULT_BUCKET=${{ vars.LEDGER_BUCKET_NAME }}
            OAUTH_VAULT_PREFIX=oauth
            FRONTEND_ORIGIN=${{ vars.FRONTEND_ORIGIN }}
            FRONTEND_URL=${{ vars.FRONTEND_URL }}
            GOOGLE_OAUTH_REDIRECT_URI=${{ vars.GOOGLE_OAUTH_REDIRECT_URI }}
            TRANSFER_MAX_ATTEMPTS=3
          secrets_update_strategy: overwrite
          secrets: |-
            GOOGLE_OAUTH_CLIENT_ID=${{ vars.SECRET_GOOGLE_OAUTH_CLIENT_ID }}:latest
            GOOGLE_OAUTH_CLIENT_SECRET=${{ vars.SECRET_GOOGLE_OAUTH_CLIENT_SECRET }}:latest
            OAUTH_STATE_SECRET=${{ vars.SECRET_OAUTH_STATE_SECRET }}:latest
            OAUTH_VAULT_KEY_BASE64=${{ vars.SECRET_OAUTH_VAULT_KEY }}:latest
            APP_ACCESS_KEY=${{ vars.SECRET_APP_ACCESS_KEY }}:latest

      - name: Show deployed service URL
        run: echo "Cloud Run service deployed at ${{ steps.deploy.outputs.url }}"
