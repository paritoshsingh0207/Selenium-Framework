name: Photos Migrator Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/local-migrator-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/local-migrator-windows.yml'

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build tested executable jar
        shell: pwsh
        run: mvn --batch-mode verify
      - name: Build self-contained Windows app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-input | Out-Null
          Copy-Item target/google-photos-migrator-0.1.0-SNAPSHOT.jar package-input/
          jpackage `
            --type app-image `
            --name PhotosMigrator `
            --input package-input `
            --main-jar google-photos-migrator-0.1.0-SNAPSHOT.jar `
            --dest dist `
            --win-console `
            --description "Zero-billing Google Photos Takeout migration utility"
          Compress-Archive -Path dist/PhotosMigrator -DestinationPath PhotosMigrator-Windows.zip -Force
      - name: Upload Windows utility
        uses: actions/upload-artifact@v4
        with:
          name: PhotosMigrator-Windows
          path: PhotosMigrator-Windows.zip
          retention-days: 14
