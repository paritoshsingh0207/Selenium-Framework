name: Google Photos Migrator CI

on:
  push:
    branches:
      - main
      - feature/google-photos-migrator
      - feature/native-zero-billing-dashboard
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'docs/**'
      - '.github/workflows/google-photos-migrator-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate zero-billing dashboard JavaScript
        run: node --check docs/app.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify legacy Java prototype
        run: mvn --batch-mode --update-snapshots verify
