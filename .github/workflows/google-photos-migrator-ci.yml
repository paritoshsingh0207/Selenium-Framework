name: Google Photos Migrator CI

on:
  push:
    branches:
      - main
      - feature/google-photos-migrator
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/google-photos-migrator-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: mvn --batch-mode --update-snapshots verify
