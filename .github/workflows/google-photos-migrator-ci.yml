name: Google Photos Migrator CI

on:
  push:
    branches:
      - main
      - feature/local-zero-billing-migrator
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'docs/**'
      - '.github/workflows/google-photos-migrator-ci.yml'
      - '.github/workflows/local-migrator-windows.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate historical dashboard JavaScript
        run: node --check docs/app.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify local migrator and regression suite
        run: mvn --batch-mode --update-snapshots verify
